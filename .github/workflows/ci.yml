# CI — self-contained (no shared/external reusable-workflow dependency). This repo goes public
# at go-live, so its CI must not point at any private, internally-owned template repo.
#
# main-only + release-tags model (no live vendor-operated deploy target for this repo — customers
# deploy via install.sh) — every PR into main runs lint/typecheck/unit/integration/secret-scan/
# container-scan directly.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ''

  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Start Postgres + Redis
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres redis
        env:
          POSTGRES_PASSWORD: warmhawk_ci
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T postgres pg_isready -U warmhawk && break
            sleep 2
          done
      - name: Run migrations
        run: npm run db:migrate --workspace=packages/db
        env:
          DATABASE_URL: postgresql://warmhawk:warmhawk_ci@localhost:4601/warmhawk
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://warmhawk:warmhawk_ci@localhost:4601/warmhawk
          REDIS_URL: redis://localhost:4602
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  container-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.${{ matrix.service }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false
          tags: warmhawk-core-engine-${{ matrix.service }}:ci
          load: true
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: warmhawk-core-engine-${{ matrix.service }}:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
