# WarmHawk Redis config — tuned for durability over raw throughput.
# Durability matters here because Redis holds the BullMQ dispatch queue itself (mailbox
# rotation/cadence jitter — computeNextSlotSeconds.ts / enqueuer.ts), not just a cache. Losing
# unflushed writes on a crash or restart means a lead silently never gets emailed, with no error
# surfaced anywhere — see this repo's "Redis Durability & Crash Recovery" section.

appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# RDB snapshots as a secondary safety net, in addition to AOF.
save 900 1
save 300 10
save 60 10000

maxmemory-policy noeviction

# Auth: requirepass is NOT set here on purpose — the password would end up in a committed file.
# docker-compose.yml passes it via `--requirepass ${REDIS_PASSWORD}` on the command line instead
# (value generated by scripts/install.sh via `openssl rand`, stored only in the customer's own
# .env), and every service's REDIS_URL embeds the same password.
