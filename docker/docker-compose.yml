# WarmHawk Core Engine — production package compose file, per the V12 Containerization Model.
#
# Lives under docker/ (2026-08-29 root-folder cleanup, matching jitterflow's own docker/
# convention) alongside every docker-compose*.yml/Dockerfile.* in this repo — always invoke as
# `docker compose -f docker/docker-compose.yml ...` from repo root, never from inside docker/
# itself (build contexts below are `..`-relative, resolved against this file's own directory).
#
# THE RULE (opposite of jitterflow's shared-host model, on purpose — see this repo's build
# report for the full contrast): every service below sits on the internal-only
# `warmhawk_internal` Docker network with NO published host port. Only `nginx` publishes 80/443.
# A WarmHawk customer's own server has no ks-platform-infra, no shared edge-nginx, no Coolify —
# this package has to be a complete, self-contained unit with zero assumptions about the host.
#
# LOCAL DEV PORT ALLOCATION (new, V12 — documented here per the same convention jitterflow's own
# docker-compose.yml header uses): this file itself publishes NO bare ports (matching what ships
# to customers exactly, so local dev and production never drift). Engineers/CI needing direct
# host access to Postgres/Redis/the API for local development or docker-compose.test.yml-driven
# integration tests use the `docker-compose.test.yml` OVERLAY, which adds `${VAR:-default}` host
# ports scoped to the reserved range below — added in the overlay, not here, so this base file's
# absence of a `ports:` block for these services can never conflict with it (Compose `ports:`
# concatenate, not override, across `-f` files — a V12 process lesson from jitterflow's own
# history; a base file with NO ports block for a service means the overlay's `ports:` for that
# service is the only one in effect, never a collision).
#
# Reserved local-dev range: 4600-4649, chosen to avoid every other project already running
# on this shared engineering machine: outreach-infra (3000/4000/5678), jitterflow
# (5433/6380/4100/4101/4200/4300/4401), gemini-gateway (8080), leadhound-engine (9501).
#   4600 = api (dev/test direct access)         4601 = postgres (docker-compose.test.yml)
#   4602 = redis (docker-compose.test.yml)      4603 = n8n
#   4604 = uptime-kuma                          4605 = n8n (webhook base URL, dev)
# warmhawk-enterprise-operator (sibling repo, separate Postgres/containers per the
# Containerization Model) reserves its own, non-overlapping range: 4500-4599 (dashboard Postgres
# on 4501 by default, per that repo's docker-compose.test.yml) — see that repo's own
# docker-compose.yml header for its exact allocation. (This comment previously said "starting at
# 4650" — stale/aspirational from when the two repos were built in parallel and never reconciled
# against what the other repo actually shipped; corrected here. 4600-4649 and 4500-4599 don't
# overlap either way, so there was never an actual port collision, just a wrong cross-reference.)

networks:
  warmhawk_internal:
    internal: true
  # Bug fix (DooD end-to-end install run, 2026-08-25): nginx previously had `warmhawk_internal`
  # as its ONLY network. `internal: true` disables Docker's NAT/masquerade setup for that network
  # entirely — a `ports:` publish on a container whose ONLY network is `internal: true` is
  # silently accepted (visible in `docker inspect`'s HostConfig) but never actually wired up; the
  # host genuinely cannot reach it. docker-compose.test.yml's own header comment already documents
  # this exact failure mode for postgres/redis/uptime-kuma (confirmed by hand there back on
  # 2026-08-21) and fixes it for THOSE services by flipping the network non-internal in the test
  # overlay — but that overlay explicitly excludes nginx/certbot ("aren't needed for integration
  # testing"), which is exactly why this instance of the same bug, on the one container this
  # package's entire design depends on being host-reachable, went uncaught until a real end-to-end
  # install: nginx started fine (no crash) and was completely unreachable from outside regardless.
  # Fixed by mirroring warmhawk-enterprise-operator/docker-compose.yml's already-correct pattern —
  # a second, non-internal network dedicated solely to nginx.
  warmhawk_edge:

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  kuma_data:
  certbot_conf:
  certbot_www:

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: *restart-policy
    environment:
      POSTGRES_USER: warmhawk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warmhawk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [warmhawk_internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warmhawk']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }
        reservations: { cpus: '0.25', memory: 256M }

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    <<: *restart-policy
    # Redis Durability (V12) — ops/redis.conf (AOF everysec, noeviction) mounted read-only;
    # password injected via --requirepass on the command line, never written into the conf file.
    command:
      ['redis-server', '/usr/local/etc/redis/redis.conf', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - ../ops/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [warmhawk_internal]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  # migrate and api build from the identical context+Dockerfile (just a different command:) — an
  # explicit shared `image:` tag (rather than each service falling back to its own default
  # <project>-<service> tag) makes that sharing unambiguous to Compose. Without it, `docker compose
  # up` intermittently built api's image but never migrate's own separate tag under load, hitting
  # "No such image: docker-migrate:latest" — confirmed live 2026-08-29 on the release-e2e scratch
  # host (a resource-constrained 2vCPU/4GB box), not reproducible every run, but real: it broke
  # pipeline #90 outright. Never reproduced on a normal dev machine's spare capacity.
  migrate:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    image: docker-api:latest
    <<: *restart-policy
    restart: 'no'
    command:
      [
        'node',
        '/repo/node_modules/.bin/prisma',
        'migrate',
        'deploy',
        '--schema',
        '/repo/packages/db/prisma/schema.prisma',
      ]
    environment:
      DATABASE_URL: postgresql://warmhawk:${POSTGRES_PASSWORD}@postgres:5432/warmhawk
    depends_on:
      postgres: { condition: service_healthy }
    networks: [warmhawk_internal]

  api:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    image: docker-api:latest
    <<: *restart-policy
    environment:
      NODE_ENV: production
      PORT: '4600'
      DATABASE_URL: postgresql://warmhawk:${POSTGRES_PASSWORD}@postgres:5432/warmhawk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      N8N_BASE_URL: http://n8n:5678
      JWT_SECRET: ${JWT_SECRET}
      MAILBOX_CREDENTIAL_KEY: ${MAILBOX_CREDENTIAL_KEY}
      NEXTJS_CALLBACK_SECRET: ${NEXTJS_CALLBACK_SECRET}
      # Auth bridge for warmhawk-enterprise-operator's dashboard — see .env.example and
      # lib/requireAuth.ts's header comment. Optional: blank is fine for a Tier-0-only install.
      OPERATOR_SERVICE_TOKEN: ${OPERATOR_SERVICE_TOKEN:-}
      DASHBOARD_APP_URL: ${DASHBOARD_APP_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
      # Stripe/license issuance was removed from this repo (V12 fix) — that
      # code now lives solely in warmhawk-site, the one piece of billing
      # infrastructure WarmHawk operates centrally. See warmhawk-site's
      # docker-compose.yml / .env.example for STRIPE_*/LICENSE_SIGNING_PRIVATE_KEY.
      # Native OTEL export — inert until the customer sets an endpoint (Observability section).
      OTEL_SERVICE_NAME: warmhawk-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [warmhawk_internal]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  worker:
    build: { context: .., dockerfile: docker/Dockerfile.worker }
    <<: *restart-policy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://warmhawk:${POSTGRES_PASSWORD}@postgres:5432/warmhawk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      N8N_BASE_URL: http://n8n:5678
      OTEL_SERVICE_NAME: warmhawk-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [warmhawk_internal]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.62.1@sha256:49082daed743802dcdbb01c9a70b87d42acee1ecbca75867739dc858dacdbc2c
    <<: *restart-policy
    environment:
      N8N_HOST: n8n
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: warmhawk
      DB_POSTGRESDB_USER: warmhawk
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Read by every HTTP Request node in n8n/workflows/*.json via $env — the internal Docker
      # network address of this package's own api service (never nginx/a public URL; these
      # workflows only ever call internal-only, requireCallbackSecret-guarded routes) and the
      # shared secret that guard checks against. Both already exist as api-service env vars above;
      # duplicated here because n8n's workflow JSON reads its OWN container's environment, not the
      # api container's.
      API_INTERNAL_BASE_URL: http://api:4600
      NEXTJS_CALLBACK_SECRET: ${NEXTJS_CALLBACK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/home/node/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
    networks: [warmhawk_internal]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1024M }
        reservations: { cpus: '0.1', memory: 256M }

  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    <<: *restart-policy
    volumes:
      - kuma_data:/app/data
    networks: [warmhawk_internal]
    deploy:
      resources:
        # Bug fix (release-e2e, 2026-08-28): 128M was too tight — Docker Compose v2 (confirmed on
        # v5.5.0, no swarm involved) applies `deploy.resources.limits` as real cgroup memory caps,
        # and Kuma's own Node process alone sits around 120-126MB anon-rss WHILE STILL BOOTING
        # (before finishing DB patches or ever starting to listen). Confirmed live via dmesg on the
        # scratch host: the kernel OOM-killer was killing the `node` process on a ~15-25s cycle,
        # forever, `restart: unless-stopped` immediately relaunching it into the same crash loop —
        # it never once finished booting long enough to accept a connection, which is what
        # provisionUptimeKuma.ts's connectWithRetry saw as a persistent "xhr poll error" regardless
        # of retry budget or transport order. 256M gives real steady-state headroom above that ~126MB
        # boot-time floor.
        limits: { cpus: '0.25', memory: 256M }
        reservations: { cpus: '0.05', memory: 64M }

  # One-shot admin-account + monitor/notification provisioning for uptime-kuma above — Kuma 1.x
  # ships with nothing configured out of the box, which contradicted tier-config's
  # `uptimeKumaBundled` claim ("on by default, 1-min checks against every service") until this
  # existed. `profiles: [tools]` keeps it out of every plain `up`/`up -d` (with or without an
  # explicit service list) — it only ever runs via `docker compose run --rm kuma-provision`, which
  # scripts/install.sh does right after `uptime-kuma` itself comes up. Reuses the api image/build
  # (packages/ops-scripts is a workspace member, see docker/Dockerfile.api) rather than adding a
  # new image just for this.
  kuma-provision:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    profiles: ['tools']
    working_dir: /repo/packages/ops-scripts
    command: ['node', '/repo/node_modules/.bin/tsx', 'src/provisionUptimeKuma.ts']
    environment:
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME:-admin}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD}
      UPTIME_KUMA_ALERT_WEBHOOK_URL: ${UPTIME_KUMA_ALERT_WEBHOOK_URL:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [warmhawk_internal]

  nginx:
    build: { context: ../nginx }
    <<: *restart-policy
    environment:
      WARMHAWK_DOMAIN: ${WARMHAWK_DOMAIN}
    # Host ports are configurable (default 80/443) so scripts/install.sh can fall back to alt ports
    # when the customer's box already has something else bound to 80/443 — see that script's port
    # selection block and docs/troubleshooting.md's "Installing alongside an existing web server".
    # Matches warmhawk-enterprise-operator/docker-compose.yml's existing NGINX_HTTP_HOST_PORT /
    # NGINX_HTTPS_HOST_PORT convention exactly, so both packages behave identically here.
    ports:
      - '${NGINX_HTTP_HOST_PORT:-80}:80'
      - '${NGINX_HTTPS_HOST_PORT:-443}:443'
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on: [api]
    networks: [warmhawk_internal, warmhawk_edge]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }

  # Renewal loop only — the INITIAL `certbot certonly --webroot` run is driven by scripts/install.sh
  # (needs to run once, interactively-checkable, before nginx's 443 block is meaningful).
  certbot:
    image: certbot/certbot:v2.11.0@sha256:ddf9e5d226a56e886986838fa0ebedc0237511c78664352e8d0f4346ee022cd8
    <<: *restart-policy
    entrypoint: /bin/sh
    command:
      [
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done',
      ]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Bug fix (release-e2e, 2026-08-28): `warmhawk_internal` is `internal: true` (see that network's
    # own header comment above) — Docker gives containers on ONLY that network no default route/NAT
    # at all, so certbot could never reach the internet, full stop. Confirmed live: `docker compose
    # run --rm --entrypoint certbot certbot certonly ...` failed with
    # `requests.exceptions.ConnectionError: ... Failed to establish a new connection: [Errno -3] Try
    # again` trying to reach acme-v02.api.letsencrypt.org — Errno -3 is DNS resolution failure,
    # exactly what an internal-only network produces. certbot doesn't talk to any other service over
    # the network (the webroot HTTP-01 challenge is exchanged with nginx via the shared certbot_www
    # volume, not a network call), so it only needs an outbound route — added here the same way
    # nginx already gets one, via the non-internal warmhawk_edge network.
    networks: [warmhawk_internal, warmhawk_edge]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }
